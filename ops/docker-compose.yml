# Alternative to launchd. Useful if the bot should keep running while the Mac
# is logged out, or to move it to a server later.
#
#   docker compose -f ops/docker-compose.yml up -d
#
# restart: unless-stopped is the Docker equivalent of KeepAlive — the container
# comes back after a crash and after a host reboot, but stays down if you stop
# it deliberately.
services:
  bot:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    restart: unless-stopped
    volumes:
      - ../runtime:/app/runtime
      - ../config:/app/config:ro
    env_file:
      - ../.env
    command: python scripts/run.py --config config/demo.yaml
    healthcheck:
      # state.json stops being updated if the loop wedges without crashing —
      # the failure mode a process check would miss.
      test: ["CMD", "python", "-c", "import json,time,sys;s=json.load(open('runtime/state.json'));sys.exit(0 if time.time()*1000-s['updated_ts']<900000 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  dashboard:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../runtime:/app/runtime
      - ../config:/app/config:ro
    command: python scripts/dashboard.py
    depends_on:
      - bot
